name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHONUTF8: '1'
  LMOCI_LIVE: '0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      v: ${{ steps.release-version.outputs.v }}
      publish: ${{ steps.release-version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test deterministic version stamping
        run: bash scripts/test-release-version.sh
      - id: release-version
        name: Derive version from the workflow run number
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            version="$(bash scripts/stamp-version.sh --base).${GITHUB_RUN_NUMBER}"
            echo "v=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "v=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, name: linux-x64, graal: '25.0.2'}
          - {os: ubuntu-22.04-arm, name: linux-arm64, graal: '25.0.2'}
          - {os: macos-15-intel, name: macos-x64, graal: '25.0.1'}
          - {os: macos-15, name: macos-arm64, graal: '25.0.2'}
          - {os: windows-2022, name: windows-x64, graal: '25.0.2'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173
        with:
          java-version: ${{ matrix.graal }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: timeout 180 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq build-essential zlib1g-dev
      - name: Install coreutils on macOS
        if: runner.os == 'macOS'
        run: brew install coreutils && echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Pinned script compiler
        run: |
          npm install --prefix "$RUNNER_TEMP/lmctl" "@lmctl-ai/lmctl@0.2.458"
          echo "$RUNNER_TEMP/lmctl/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Stamp release version for this main push
        if: needs.version.outputs.v != ''
        run: bash scripts/stamp-version.sh "${{ needs.version.outputs.v }}"
      - name: JVM, fake endpoints and examples
        timeout-minutes: 25
        run: bash test.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Native image
        timeout-minutes: 30
        run: bash scripts/build-native.sh
      - name: Native, fake endpoints and examples
        timeout-minutes: 30
        run: LMOCI_NATIVE=1 bash test.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package tested executable
        run: |
          mkdir -p dist
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          cp "target/lmoci$suffix" "dist/lmoci-${{ matrix.name }}$suffix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lmoci-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REL_VERSION: ${{ needs.version.outputs.v }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lmoci-*
          path: dist
          merge-multiple: true
      - name: Verify platform set, embedded version and checksums
        run: |
          for required in lmoci-linux-x64 lmoci-linux-arm64 lmoci-macos-x64 lmoci-macos-arm64 lmoci-windows-x64.exe; do
            test -f "dist/$required" || { echo "missing tested artifact: $required"; exit 1; }
          done
          chmod +x dist/lmoci-linux-x64 dist/lmoci-linux-arm64 dist/lmoci-macos-x64 dist/lmoci-macos-arm64
          got="$(dist/lmoci-linux-x64 --version)"
          test "$got" = "lmoci $REL_VERSION" || { echo "binary says '$got', expected lmoci $REL_VERSION"; exit 1; }
          (cd dist && sha256sum lmoci-* > SHA256SUMS)
      - name: Publish or refresh the CI-owned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$REL_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --latest --title "lmoci $REL_VERSION" \
              --notes "lmoci $REL_VERSION, built and tested on all five native platforms by the repository CI." \
              dist/*
          fi
